name: Docker CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: self-hosted

    steps:
      - name: Pull Latest Code
        run: |
          cd /home/ubuntu/github-ci-cd-project
          git pull origin main

      - name: Build Docker Image
        run: |
          cd /home/ubuntu/github-ci-cd-project
          docker build -t github-ci-cd-project .

      - name: Run Tests
        run: |
          cd /home/ubuntu/github-ci-cd-project
          docker run --rm github-ci-cd-project npm run test

  cd:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Restart Application
        run: |
          docker stop backend-prod || true
          docker rm backend-prod || true
          docker run -d \
            --name backend-prod \
            -p 3000:3000 \
            github-ci-cd-project
